app = "multiplayer-fabric-observability"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "observability_data"
  destination = "/var/lib"
  initial_size = "10gb"

# VictoriaMetrics query UI (health check endpoint)
[[services]]
  internal_port = 8428
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false
  [[services.ports]]
    port = 8428
    handlers = ["http"]
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# VictoriaLogs query UI
[[services]]
  internal_port = 9428
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false
  [[services.ports]]
    port = 9428
    handlers = ["http"]

# VictoriaTraces query UI
[[services]]
  internal_port = 10428
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false
  [[services.ports]]
    port = 10428
    handlers = ["http"]

# OTLP 4317 (gRPC) and 4318 (HTTP) are NOT listed here.
# Other Fly apps reach them via multiplayer-fabric-observability.internal:4317/4318
# on the private WireGuard network — no public exposure needed.

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
